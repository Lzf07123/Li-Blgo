log_format liblog_beacon '$time_iso8601|$request_uri';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/rss+xml application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # 媒体单文件限制由应用层（5MB）控制；100m 仅为允许较大的备份 ZIP 上传
    client_max_body_size 100m;
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 匿名统计打点：1×1 像素，日志只含 时间|路径（无 IP/UA/Cookie）
    location = /api/beacon {
        access_log /var/log/nginx/beacon.log liblog_beacon;
        empty_gif;
    }

    # 后台反代（路径与 ADMIN_PATH 保持一致）
    location ^~ /admin/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_upstream admin:8000;
        proxy_pass http://$admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'self'" always;
        error_page 502 /admin-off.html;
    }

    location = /admin-off.html {
        default_type text/html; charset utf-8;
        return 200 '服务暂不可用，请稍后重试';
    }

    # 版本化静态资源长缓存（?v= 变更时自动失效）
    location ~* \.(css|js|png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

