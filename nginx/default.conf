log_format liblog_beacon '$time_iso8601|$request_uri';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 8m;
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 匿名统计打点：1×1 像素，日志只含 时间|路径（无 IP/UA/Cookie）
    location = /api/beacon {
        access_log /var/log/nginx/beacon.log liblog_beacon;
        empty_gif;
    }

    # 后台反代（路径与 ADMIN_PATH 保持一致）
    location /admin/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_upstream admin:8000;
        proxy_pass http://$admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        add_header X-Frame-Options SAMEORIGIN always;
        error_page 502 /admin-off.html;
    }

    location = /admin-off.html {
        default_type text/html; charset utf-8;
        return 200 '服务暂不可用，请稍后重试';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
