log_format liblog_beacon '$time_iso8601|$request_uri';

server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript application/rss+xml application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # 媒体单文件限制由应用层（5MB）控制；100m 仅为允许较大的备份 ZIP 上传
    client_max_body_size 100m;
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    # 产物缺失（新部署未构建）时返回“构建中”引导页，而不是 403
    error_page 403 /pending.html;
    location = /pending.html {
        internal;
        root /usr/share/nginx;
        default_type text/html;
    }

    # 匿名统计打点：1×1 像素，日志只含 时间|路径（无 IP/UA/Cookie）
    location = /api/beacon {
        access_log /var/log/nginx/beacon.log liblog_beacon;
        empty_gif;
    }

    # 站点元数据文件：短缓存即可
    location ~ ^/(robots\.txt|llms\.txt|security\.txt|humans\.txt)$ {
        expires 1h;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
    }

    # 后台反代（路径与 ADMIN_PATH 保持一致）
    location ^~ /admin/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_upstream admin:8000;
        proxy_pass http://$admin_upstream;
        proxy_set_header Host $host;
        # 覆盖为 nginx 看到的真实客户端 IP（避免客户端伪造 XFF 绕过 IP 白名单/登录限速）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'self'" always;
        error_page 502 /admin-off.html;
    }

    location = /admin-off.html {
        internal;
        root /usr/share/nginx;
        default_type text/html; charset utf-8;
    }

    # 搜索索引随重建变化，短缓存即可
    location = /search/index.json {
        expires 5m;
    }

    # 媒体图片：长缓存（重建后路径不变时内容不变）
    location ~* ^/img/ {
        expires 7d;
    }

    # HTML 不缓存：内容变更即时生效（浏览器每次重新校验）
    location ~* \.html$ {
        expires 0;
    }

    # 版本化静态资源长缓存（?v= 变更时自动失效）
    location ~* \.(css|js|png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

