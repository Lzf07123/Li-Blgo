<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>创建管理员 · {{ brand.name }} 设置</title>
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/tokens.css?v=37">
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/style.css?v=56">
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/admin.css?v=39">
</head>
<body class="admin-body auth-page">
  <main class="auth-shell">
    <aside class="auth-aside">
      <div class="auth-brand">
        <span class="auth-logo" aria-hidden="true">{{ brand.name[:1] }}</span>
        <span class="auth-brand-name">{{ brand.name }}</span>
      </div>
      <div class="auth-aside-body">
        <svg class="auth-lock" viewBox="0 0 64 64" aria-hidden="true">
          <path class="auth-lock-shackle" d="M20 28v-9a12 12 0 0 1 24 0v9"/>
          <rect class="auth-lock-body" x="12" y="28" width="40" height="26" rx="6"/>
          <circle class="auth-lock-hole" cx="32" cy="40" r="4"/>
          <path class="auth-lock-hole" d="M32 44v7"/>
        </svg>
        <p class="auth-kicker">首次设置</p>
        <h1 class="auth-title">{{ brand.name }}</h1>
        <p class="auth-tagline">{{ brand.tagline }}</p>
        <ol class="auth-steps">
          <li>基础信息</li>
          <li class="is-current">创建管理员</li>
          <li>绑定 OIDC（可选）</li>
        </ol>
      </div>
      <p class="auth-aside-note">第 2 步 / 共 3 步</p>
    </aside>
    <section class="auth-panel">
      <p class="auth-step">第 2 步 / 共 3 步</p>
      <h2 class="auth-heading">创建管理员</h2>
      <p class="auth-sub">密码至少 8 位，建议使用密码管理器生成</p>
      {% if error %}<p class="flash auth-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/{{ admin_path }}/setup/account" class="auth-form">
        <input type="hidden" name="_csrf" value="{{ csrf }}">
        <label>用户名（至少 3 位）<input type="text" name="username" autocomplete="username" required></label>
        <label>密码（至少 8 位）<input id="setup-pw" type="password" name="password" autocomplete="new-password" required></label>
        <label>确认密码<input id="setup-pw2" type="password" name="confirm" autocomplete="new-password" required></label>
        <p id="setup-pw-hint" class="field-help" role="status"></p>
        <button type="submit" class="btn btn-block">创建并继续</button>
      </form>
    </section>
  </main>
  <script>
    (function () {
      var pw = document.getElementById("setup-pw");
      var pw2 = document.getElementById("setup-pw2");
      var hint = document.getElementById("setup-pw-hint");
      function update() {
        var msgs = [];
        if (pw.value && pw.value.length < 8) msgs.push("密码至少 8 位");
        if (pw.value && !/[A-Z]/.test(pw.value)) msgs.push("建议包含大写字母");
        if (pw.value && !/[0-9]/.test(pw.value)) msgs.push("建议包含数字");
        if (pw.value && pw2.value && pw.value !== pw2.value) msgs.push("两次密码不一致");
        hint.textContent = msgs.join("；");
      }
      pw.addEventListener("input", update);
      pw2.addEventListener("input", update);
    })();
  </script>
</body>
</html>
