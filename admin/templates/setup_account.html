<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>创建管理员 · Li&Blog 设置</title>
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/tokens.css">
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/admin.css">
</head>
<body class="admin-body admin-center">
  <main class="auth-card">
    <h1>第二步：创建管理员</h1>
    {% if error %}<p class="flash">{{ error }}</p>{% endif %}
    <form method="post" action="/{{ admin_path }}/setup/account">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>用户名（至少 3 位）<input type="text" name="username" required></label>
      <label>密码（至少 8 位）<input type="password" name="password" required></label>
      <label>确认密码<input type="password" name="confirm" required></label>
      <button type="submit" class="btn">创建并继续</button>
    </form>
  </main>
</body>
</html>
