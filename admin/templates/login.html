<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · {{ brand.name }}</title>
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/tokens.css?v=38">
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/style.css?v=60">
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/admin.css?v=39">
  <script>
    (function () {
      var saved = localStorage.getItem("liblog-admin-theme");
      if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>
<body class="admin-body auth-page">
  <main class="auth-shell">
    <aside class="auth-aside">
      <div class="auth-brand">
        {% if brand.logo %}<img class="auth-logo-img" src="{{ brand.logo }}" alt="{{ brand.name }}">{% else %}<span class="auth-logo" aria-hidden="true">{{ brand.name[:1] }}</span>{% endif %}
        <span class="auth-brand-name">{{ brand.name }}</span>
      </div>
      <div class="auth-aside-body">
        <svg class="auth-lock" viewBox="0 0 64 64" aria-hidden="true">
          <path class="auth-lock-shackle" d="M20 28v-9a12 12 0 0 1 24 0v9"/>
          <rect class="auth-lock-body" x="12" y="28" width="40" height="26" rx="6"/>
          <circle class="auth-lock-hole" cx="32" cy="40" r="4"/>
          <path class="auth-lock-hole" d="M32 44v7"/>
        </svg>
        <p class="auth-kicker">后台管理</p>
        <h1 class="auth-title">{{ brand.name }}</h1>
        <p class="auth-tagline">{{ brand.tagline }}</p>
        <p class="auth-promise">{{ brand.promise }}</p>
      </div>
      <p class="auth-aside-note">仅管理员可访问</p>
    </aside>
    <section class="auth-panel">
      <div class="auth-theme-row">
        <button id="auth-theme-toggle" class="btn btn-sm btn-ghost" type="button">深浅色</button>
      </div>
      <p class="auth-step">登录</p>
      <h2 class="auth-heading">欢迎回来</h2>
      <p class="auth-sub">使用管理员账号继续</p>
      {% if error %}<p class="flash auth-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/{{ admin_path }}/login" class="auth-form">
        <input type="hidden" name="_csrf" value="{{ csrf }}">
        <label>用户名<input type="text" name="username" autocomplete="username" required></label>
        <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn btn-block">登录</button>
      </form>
      {% if oidc_enabled %}
      <div class="auth-divider" role="separator"><span>或</span></div>
      <a class="btn btn-ghost btn-block" href="/{{ admin_path }}/login/oidc">使用 Li&Pass 登录</a>
      {% endif %}
    </section>
  </main>
  <script>
    (function () {
      var btn = document.getElementById("auth-theme-toggle");
      if (btn) {
        btn.setAttribute("aria-pressed", document.documentElement.classList.contains("dark") ? "true" : "false");
        btn.addEventListener("click", function () {
          var root = document.documentElement;
          var dark = root.classList.toggle("dark");
          localStorage.setItem("liblog-admin-theme", dark ? "dark" : "light");
          btn.setAttribute("aria-pressed", dark ? "true" : "false");
        });
      }
    })();
  </script>
</body>
</html>
