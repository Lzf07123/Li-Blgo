<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Li&Blog 后台</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-body admin-center">
  <main class="auth-card">
    <h1>Li&Blog 后台</h1>
    {% if error %}<p class="flash">{{ error }}</p>{% endif %}
    <form method="post" action="/{{ admin_path }}/login">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>用户名<input type="text" name="username" autocomplete="username" required></label>
      <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn">登录</button>
    </form>
    {% if oidc_enabled %}
    <p class="auth-divider">或</p>
    <a class="btn btn-ghost" href="/{{ admin_path }}/login/oidc">使用 Li&Pass 登录</a>
    {% endif %}
  </main>
</body>
</html>
