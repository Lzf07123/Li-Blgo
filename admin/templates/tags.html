{% extends "base.html" %}
{% block title %}标签管理 · Li&Blog 后台{% endblock %}
{% block content %}
<nav class="admin-breadcrumb" aria-label="面包屑">
  <a href="/{{ admin_path }}/">仪表盘</a>
  <span class="admin-breadcrumb-sep" aria-hidden="true">/</span>
  <span aria-current="page">标签管理</span>
</nav>
<div class="list-head">
  <h1>标签管理（{{ tags|length }}）</h1>
</div>
{% with table = table %}{% include "partials/table.html" %}{% endwith %}
<div class="admin-card">
  <h2>重命名 / 合并 / 删除</h2>
  <p class="field-help">选择要操作的标签；合并会把旧标签替换为新标签并去重，删除会从所有文章移除该标签。操作后自动重建公开站。</p>
  <form method="post" action="/{{ admin_path }}/tags/apply" class="list-filters" data-busy>
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <select name="old_tag" aria-label="旧标签" required data-custom-dropdown>
      {% for t in tags %}
      <option value="{{ t.name }}">{{ t.name }}（{{ t.count }}）</option>
      {% endfor %}
    </select>
    <input type="text" name="new_tag" placeholder="新标签（删除时留空）">
    <select name="action" aria-label="操作" data-custom-dropdown>
      <option value="rename">重命名</option>
      <option value="merge">合并到新标签</option>
      <option value="delete">删除标签</option>
    </select>
    <button type="submit" class="btn btn-secondary btn-sm">执行</button>
  </form>
</div>
{% endblock %}
