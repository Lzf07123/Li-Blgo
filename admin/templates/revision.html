{% extends "base.html" %}
{% block content %}
<nav class="admin-breadcrumb" aria-label="面包屑">
  <a href="/{{ admin_path }}/">仪表盘</a>
  <span class="admin-breadcrumb-sep" aria-hidden="true">/</span>
  <a href="/{{ admin_path }}/posts">文章</a>
  <span class="admin-breadcrumb-sep" aria-hidden="true">/</span>
  <a href="/{{ admin_path }}/posts/{{ slug }}/edit">{{ slug }}</a>
  <span class="admin-breadcrumb-sep" aria-hidden="true">/</span>
  <span aria-current="page">修订 {{ ts }}</span>
</nav>
<div class="list-head">
  <h1>{{ title }} <small class="table-title-meta">{{ ts }}</small></h1>
  <a class="btn btn-secondary btn-sm" href="/{{ admin_path }}/posts/{{ slug }}/edit">返回编辑</a>
</div>
<pre class="revision-body">{{ body }}</pre>
{% endblock %}
