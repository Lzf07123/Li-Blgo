<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Li&Blog 后台{% endblock %}</title>
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/tokens.css?v=36">
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/style.css?v=46">
  <link rel="stylesheet" href="/{{ admin_path }}/static/css/admin.css?v=35">
  <script>
    (function () {
      var saved = localStorage.getItem("liblog-admin-theme");
      if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-head">
        <a class="admin-brand" href="/{{ admin_path }}/">
          <span class="admin-brand-mark" aria-hidden="true">L</span>
          <span>Li&Blog 后台</span>
        </a>
        <div class="admin-sidebar-actions">
          <a class="btn btn-sm btn-ghost" href="/" target="_blank" rel="noopener">公开站</a>
          <button id="theme-toggle" class="btn btn-sm btn-ghost" type="button" aria-label="切换深浅色">深浅色</button>
        </div>
      </div>
      <nav class="admin-nav" aria-label="后台栏目">
        {% for group in nav_groups %}
        <div class="admin-nav-group">
          <p class="admin-nav-group-label">{{ group["label"] }}</p>
          {% for item in group["items"] %}
          <a href="/{{ admin_path }}{{ item["path"] }}" class="admin-nav-link{{ ' active' if item["active"] else '' }}">
            <svg class="admin-nav-icon" aria-hidden="true"><use href="#nav-icon-{{ item["icon"] }}"></use></svg>
            <span>{{ item["label"] }}</span>
          </a>
          {% endfor %}
        </div>
        {% endfor %}
      </nav>
      <div class="admin-sidebar-foot">
        <form method="post" action="/{{ admin_path }}/logout" data-busy>
          <input type="hidden" name="_csrf" value="{{ csrf }}">
          <button type="submit" class="admin-nav-link admin-nav-logout-btn">
            <svg class="admin-nav-icon" aria-hidden="true"><use href="#nav-icon-logout"></use></svg>
            <span>登出</span>
          </button>
        </form>
      </div>
    </aside>
    <main class="admin-main">
      {% if flash %}<p class="flash{{ ' flash--error' if flash_type == 'error' else '' }}" role="status">{{ flash }}</p>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="nav-icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M9 13h6"></path><path d="M9 17h6"></path>
    </symbol>
    <symbol id="nav-icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
    </symbol>
    <symbol id="nav-icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path>
    </symbol>
    <symbol id="nav-icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
    </symbol>
    <symbol id="nav-icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
    </symbol>
    <symbol id="nav-icon-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13.5" cy="6.5" r="1"></circle><circle cx="17.5" cy="10.5" r="1"></circle><circle cx="8.5" cy="7.5" r="1"></circle><circle cx="6.5" cy="12.5" r="1"></circle>
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
    </symbol>
    <symbol id="nav-icon-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 10H3"></path><path d="M21 6H3"></path><path d="M21 14H3"></path><path d="M17 18H3"></path>
    </symbol>
    <symbol id="nav-icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path>
    </symbol>
    <symbol id="nav-icon-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2"></rect><circle cx="8" cy="12" r="2"></circle>
      <path d="M5 17c0-1.7 1.8-2.5 3-2.5s3 .8 3 2.5"></path><path d="M15 10h4"></path><path d="M15 14h4"></path>
    </symbol>
    <symbol id="nav-icon-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="m21 15-5-5L5 21"></path>
    </symbol>
    <symbol id="nav-icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v18h18"></path><path d="M8 17v-5"></path><path d="M13 17V7"></path><path d="M18 17v-3"></path>
    </symbol>
    <symbol id="nav-icon-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="5" rx="1"></rect><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path>
    </symbol>
    <symbol id="nav-icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path>
    </symbol>
  </svg>
  <button id="to-top" class="to-top" type="button" aria-label="返回顶部">↑</button>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (btn) {
        btn.setAttribute("aria-pressed", document.documentElement.classList.contains("dark") ? "true" : "false");
        btn.addEventListener("click", function () {
          var root = document.documentElement;
          var dark = root.classList.toggle("dark");
          localStorage.setItem("liblog-admin-theme", dark ? "dark" : "light");
          btn.setAttribute("aria-pressed", dark ? "true" : "false");
        });
      }
      document.querySelectorAll("form[data-busy]").forEach(function (form) {
        form.addEventListener("submit", function () {
          var button = form.querySelector('button[type="submit"]');
          if (button) {
            button.disabled = true;
            button.textContent = "处理中…";
          }
        });
      });
      var activeNav = document.querySelector(".admin-nav-link.active");
      if (activeNav && activeNav.scrollIntoView) {
        activeNav.scrollIntoView({ block: "nearest", inline: "center" });
      }
      var toTop = document.getElementById("to-top");
      if (toTop) {
        window.addEventListener("scroll", function () {
          toTop.classList.toggle("is-visible", window.scrollY > 400);
        }, { passive: true });
        toTop.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
    })();
  </script>
  <script src="/{{ admin_path }}/static/js/admin-dropdown.js"></script>
</body>
</html>
