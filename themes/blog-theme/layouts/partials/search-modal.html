{{ $strings := hugo.Data.strings }}
<div id="search-modal" class="search-modal" hidden>
  <div class="search-modal-backdrop" data-close-search></div>
  <div class="search-modal-panel" role="dialog" aria-modal="true" aria-label="{{ $strings.nav.search }}">
    <div class="search-modal-head">
      <svg class="search-modal-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="search-modal-input" class="search-modal-input" type="search"
             placeholder="{{ $strings.home.search_placeholder }}" autocomplete="off"
             aria-label="{{ $strings.common.search_label }}">
      <button type="button" class="search-modal-close" data-close-search aria-label="{{ $strings.common.close }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="search-modal-body">
      <p id="search-modal-info" class="search-info" role="status" aria-live="polite"></p>
      <ul id="search-modal-results" class="search-results"></ul>
      <div id="search-modal-empty" class="search-empty-state" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11 8v4m0 3h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <p id="search-empty-text"></p>
        <a href="/posts/">{{ $strings.home.browse_posts }}</a>
      </div>
    </div>
    <div class="search-modal-hints">
      <span><kbd>Esc</kbd> {{ $strings.common.close }}</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> {{ $strings.common.search_select }}</span>
      <span><kbd>Enter</kbd> {{ $strings.common.search_open }}</span>
    </div>
  </div>
</div>
<script defer src="{{ "js/fuse.min.js" | relURL }}"></script>
<script>
  (function () {
    var modal = document.getElementById("search-modal");
    var input = document.getElementById("search-modal-input");
    var list = document.getElementById("search-modal-results");
    var info = document.getElementById("search-modal-info");
    var empty = document.getElementById("search-modal-empty");
    var emptyText = document.getElementById("search-empty-text");
    var STRINGS = {{ hugo.Data.strings.home | jsonify }};
    var fuse = null;
    var items = [];
    var activeIndex = -1;
    var lastTrigger = null;
    var indexPromise = null;

    function ensureIndex() {
      if (!indexPromise) {
        indexPromise = fetch("/search/index.json")
          .then(function (r) { return r.json(); })
          .then(function (posts) {
            fuse = new Fuse(posts, { keys: ["title", "summary", "tags"], includeScore: true });
          })
          .catch(function () { indexPromise = null; });
      }
      return indexPromise;
    }

    function setActive(index) {
      activeIndex = index;
      Array.prototype.forEach.call(list.children, function (li, i) {
        li.classList.toggle("is-active", i === index);
        if (i === index) li.scrollIntoView({ block: "nearest" });
      });
    }

    function render(q) {
      list.innerHTML = "";
      items = [];
      activeIndex = -1;
      empty.hidden = true;
      if (!q || !fuse) { info.textContent = ""; return; }
      var found = fuse.search(q).slice(0, 20);
      info.textContent = found.length + " " + STRINGS.result_count;
      if (!found.length) {
        emptyText.textContent = STRINGS.no_results;
        empty.hidden = false;
        return;
      }
      function highlight(text, needle) {
        var i = text.toLowerCase().indexOf(needle.toLowerCase());
        if (i < 0) return document.createTextNode(text);
        var frag = document.createDocumentFragment();
        frag.appendChild(document.createTextNode(text.slice(0, i)));
        var mark = document.createElement("mark");
        mark.textContent = text.slice(i, i + needle.length);
        frag.appendChild(mark);
        frag.appendChild(document.createTextNode(text.slice(i + needle.length)));
        return frag;
      }
      found.forEach(function (r) {
        var li = document.createElement("li");
        li.className = "search-item";
        var a = document.createElement("a");
        a.href = r.item.url;
        var title = document.createElement("span");
        title.className = "search-item-title";
        title.appendChild(highlight(r.item.title, q));
        var snippet = document.createElement("span");
        snippet.className = "search-item-snippet";
        snippet.appendChild(highlight(r.item.summary || "", q));
        a.appendChild(title);
        a.appendChild(snippet);
        li.appendChild(a);
        li.addEventListener("mouseenter", function () { setActive(Array.prototype.indexOf.call(list.children, li)); });
        list.appendChild(li);
        items.push(a);
      });
    }

    function open(trigger) {
      lastTrigger = trigger || document.activeElement;
      modal.hidden = false;
      document.body.classList.add("search-modal-open");
      input.value = "";
      render("");
      input.focus();
      ensureIndex();
    }
    function close() {
      modal.hidden = true;
      document.body.classList.remove("search-modal-open");
      if (lastTrigger && lastTrigger.focus) lastTrigger.focus();
    }

    document.querySelectorAll("[data-open-search]").forEach(function (btn) {
      btn.addEventListener("click", function () { open(btn); });
    });
    document.querySelectorAll("[data-close-search]").forEach(function (el) {
      el.addEventListener("click", close);
    });
    document.addEventListener("keydown", function (e) {
      if (modal.hidden) {
        if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); open(); }
        return;
      }
      if (e.key === "Escape") { close(); return; }
      if (e.key === "ArrowDown") { e.preventDefault(); setActive(Math.min(activeIndex + 1, items.length - 1)); }
      if (e.key === "ArrowUp") { e.preventDefault(); setActive(Math.max(activeIndex - 1, 0)); }
      if (e.key === "Enter" && activeIndex >= 0 && items[activeIndex]) { window.location.href = items[activeIndex].href; }
    });

    input.addEventListener("input", function () { render(input.value.trim()); });
  })();
</script>
