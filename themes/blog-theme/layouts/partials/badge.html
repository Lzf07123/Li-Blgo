{{ $label := .label | default .name }}
{{ if .readme }}
<span class="badge badge-readme" {{ with .color }}style="--badge-readme-bg: {{ . }}"{{ end }}>
  {{ if .href }}<a class="badge-readme-link" href="{{ .href }}">{{ $label }}</a>{{ else }}<span class="badge-readme-label">{{ $label }}</span>{{ end }}
</span>
{{ else }}
<span class="badge">
  {{ with .color }}<span class="badge-dot" style="background-color: {{ . }}"></span>{{ else }}<span class="badge-dot badge-dot-default"></span>{{ end }}
  {{ if .href }}<a class="badge-link" href="{{ .href }}">{{ $label }}</a>{{ else }}<span class="badge-label">{{ $label }}</span>{{ end }}
</span>
{{ end }}
