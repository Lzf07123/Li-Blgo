{{ if eq .density "none" }}{{ return }}{{ end }}
<div class="ambient ambient-{{ .density }}" aria-hidden="true">
  <span class="aurora aurora-1"></span>
  <span class="aurora aurora-2"></span>
  {{ if eq .density "full" }}
  <span class="aurora aurora-3"></span>
  <span class="aurora aurora-4"></span>
  <span class="tech-dot dot-1"></span>
  <span class="tech-dot dot-2"></span>
  <span class="tech-dot dot-3"></span>
  <span class="shape shape-line"></span>
  <span class="shape shape-square"></span>
  <span class="shape shape-z"></span>
  {{ end }}
</div>
