{{ $title := .title | default "" }}
{{ $kind := .kind | default "post" }}
{{ $hex := substr (md5 $title) 0 1 }}
{{ $chars := split "0123456789abcdef" "" }}
{{ $idx := 0 }}
{{ range $i, $c := $chars }}{{ if eq $c $hex }}{{ $idx = $i }}{{ end }}{{ end }}
{{ $variant := mod $idx 6 }}
<div class="card-visual card-visual--{{ $variant }} card-visual--{{ $kind }}" aria-hidden="true">
  <span class="card-visual-orb"></span>
  <span class="card-visual-ring"></span>
</div>
