{{ define "main" }}
{{ $strings := hugo.Data.strings }}
<h1 class="page-title">{{ .Title }}</h1>
<p class="meta">{{ $strings.home.search_hint }}</p>
<label class="search-label" for="q">{{ $strings.common.search_label }}</label>
<input id="q" class="search-input" type="search" placeholder="{{ $strings.home.search_placeholder }}" autocomplete="off">
<p id="result-info" class="search-info" role="status" aria-live="polite"></p>
<ul id="results" class="search-results"></ul>
{{ end }}
{{ define "scripts" }}
<script defer src="{{ "js/fuse.min.js" | relURL }}"></script>
<script defer>
  var STRINGS = {{ hugo.Data.strings.home | jsonify }};
fetch('/search/index.json')
  .then(function (r) { return r.json(); })
  .then(function (posts) {
    var fuse = new Fuse(posts, { keys: ['title', 'summary', 'tags'], includeScore: true });
    var input = document.getElementById('q');
    var list = document.getElementById('results');
    var info = document.getElementById('result-info');
    input.addEventListener('input', function () {
      list.innerHTML = '';
      var q = input.value.trim();
      if (!q) { info.textContent = ''; return; }
      var found = fuse.search(q).slice(0, 20);
      info.textContent = found.length + ' ' + STRINGS.result_count;
      found.forEach(function (r) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = r.item.url;
        a.textContent = r.item.title;
        var p = document.createElement('p');
        p.className = 'search-snippet';
        p.textContent = r.item.summary || '';
        li.appendChild(a);
        li.appendChild(p);
        list.appendChild(li);
      });
      if (!found.length) {
        var li = document.createElement('li');
        li.className = 'search-empty';
        li.textContent = STRINGS.no_results;
        list.appendChild(li);
      }
    });
  });
</script>
{{ end }}
