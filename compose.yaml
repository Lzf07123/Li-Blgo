services:
  nginx:
    image: ${DOCKER_MIRROR_PREFIX:-}nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - beacon-log:/var/log/nginx
    restart: unless-stopped

  admin:
    profiles: ["admin"]
    # 镜像内以 UID 1000 非 root 运行；仓库 bind 挂载目录需对 UID 1000 可写
    init: true
    build:
      context: .
      args:
        DOCKER_MIRROR_PREFIX: ${DOCKER_MIRROR_PREFIX:-}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - path: .env
        required: false
    environment:
      ADMIN_PATH: ${ADMIN_PATH:-admin}
      GOMEMLIMIT: ${GOMEMLIMIT:-256MiB}
      HUGO_NUMWORKERMULTIPLIER: ${HUGO_NUMWORKERMULTIPLIER:-0.5}
      HUGO_BIN: hugo
      BEACON_LOG: /app/beacon/beacon.log
    volumes:
      - ./content:/app/content
      - ./config:/app/config
      - ./output:/app/output
      - ./data:/app/data
      - ./themes/blog-theme/static/img:/app/themes/blog-theme/static/img
      - beacon-log:/app/beacon
    restart: "no"

volumes:
  beacon-log:
