services:
  nginx:
    image: ${DOCKER_MIRROR_PREFIX:-}nginx:alpine
    mem_limit: 128m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - ./nginx/pending.html:/usr/share/nginx/pending.html:ro
      - ./nginx/admin-off.html:/usr/share/nginx/admin-off.html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - beacon-log:/var/log/nginx
    restart: unless-stopped

  admin:
    profiles: ["admin"]
    mem_limit: 512m
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.build-tmp:size=512m,uid=1000,gid=1000
      - /app/.preview-out:size=128m,uid=1000,gid=1000
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 镜像内以 UID 1000 非 root 运行；仓库 bind 挂载目录需对 UID 1000 可写
    init: true
    build:
      context: .
      args:
        DOCKER_MIRROR_PREFIX: ${DOCKER_MIRROR_PREFIX:-}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - path: .env
        required: false
    environment:
      ADMIN_PATH: ${ADMIN_PATH:-admin}
      GOMEMLIMIT: ${GOMEMLIMIT:-256MiB}
      HUGO_NUMWORKERMULTIPLIER: ${HUGO_NUMWORKERMULTIPLIER:-0.5}
      HUGO_BIN: hugo
      HUGO_CACHEDIR: /tmp/hugo-cache
      BUILD_LOCK_PATH: /app/data/.build.lock
      BEACON_LOG: /app/beacon/beacon.log
    volumes:
      - ./content:/app/content
      - ./config:/app/config
      - blog-data:/app/data
      - ./output:/app/output
      - blog-media:/app/themes/blog-theme/static/img
      - beacon-log:/app/beacon
    restart: "no"

volumes:
  beacon-log:
  blog-data:
  blog-media:
