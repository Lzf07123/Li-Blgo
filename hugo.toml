# 禁止占位域名：本地/未配置时使用相对 baseURL；
# 部署时由 scripts/build.py 通过 SITE_BASEURL 环境变量注入真实域名
baseURL = "/"
title = "Li&Blog"
theme = "blog-theme"
dataDir = "config"
defaultContentLanguage = "zh-cn"
timeZone = "Asia/Shanghai"
enableRobotsTXT = true

[pagination]
pagerSize = 20

[taxonomies]
tag = "tags"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
codeFences = true
lineNos = true
lineNumbersInTable = false
noClasses = false
style = "friendly"

[outputs]
home = ["HTML", "RSS", "LLMS", "Security", "Humans"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[outputFormats.Search]
mediaType = "application/json"
baseName = "index"
isPlainText = true
notAlternativeFormats = true

[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternativeFormats = true

[outputFormats.Security]
mediaType = "text/plain"
baseName = "security"
isPlainText = true
notAlternativeFormats = true

[outputFormats.Humans]
mediaType = "text/plain"
baseName = "humans"
isPlainText = true
notAlternativeFormats = true

[params]
themeKey = "liblog-theme"
