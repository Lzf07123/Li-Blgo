# 禁止占位域名：本地/未配置时使用相对 baseURL；
# 部署时由 scripts/build.py 通过 SITE_BASEURL 环境变量注入真实域名
baseURL = "/"
title = "Li&Blog"
theme = "blog-theme"
dataDir = "config"
defaultContentLanguage = "zh-cn"
timeZone = "Asia/Shanghai"
enableRobotsTXT = true

[pagination]
pagerSize = 20

[taxonomies]
tag = "tags"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
codeFences = true
lineNos = true
lineNumbersInTable = false
noClasses = false
style = "friendly"

# 文章侧边目录：识别 Markdown 二级/三级标题（自动生成锚点）
[markup.tableOfContents]
startLevel = 2
endLevel = 3

[outputs]
home = ["HTML", "RSS", "LLMS", "Security", "Humans"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[related]
  includeNewer = true
  threshold = 80
  toLower = true

[[related.indices]]
  name = "tags"
  cardinalityThreshold = 3
  weight = 80

[[related.indices]]
  name = "date"
  weight = 20

[outputFormats.Search]
mediaType = "application/json"
baseName = "index"
isPlainText = true
notAlternativeFormats = true

[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternativeFormats = true

[outputFormats.Security]
mediaType = "text/plain"
baseName = "security"
isPlainText = true
notAlternativeFormats = true

[outputFormats.Humans]
mediaType = "text/plain"
baseName = "humans"
isPlainText = true
notAlternativeFormats = true

[params]
themeKey = "liblog-theme"
rss_full = false  # RSS 输出全文（true）或摘要（false）
